<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDE3D1">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Oya Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&family=Space+Mono:wght@700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  color-scheme:light;
  --page:#EDE3D1;      /* sand background */
  --night:#FFFAF1;     /* inset fields */
  --night-2:#F7EEDF;   /* panels */
  --night-3:#EADCC4;   /* pills, quiet buttons */
  --line:#D9C6A5;
  --text:#2A1F14;
  --muted:#6E5D48;
  --a:#D93A31; --a-fg:#FFFFFF;
  --b:#2F62D9; --b-fg:#FFFFFF;
  --c:#F5B100; --c-fg:#2A1D00;
  --d:#178A4C; --d-fg:#FFFFFF;
  --sun:#B44A12;       /* burnt orange accent */
  --on-sun:#FFF8EE;
  --shadow:rgba(90,62,28,.28);
  --display:"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Space Mono", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:18px 40px;
  background:var(--page)}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#app{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:20px}

.logo{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:.9;margin:0}
.logo .o{color:var(--sun)}
.logo .q{color:var(--text)}
.logo .bang{color:var(--a)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .logo{font-size:30px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--night-3);font-weight:800;font-size:14px}
.pill.cat{background:var(--catc);color:var(--catfg)}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:900;font-size:16px;background:var(--night-3);color:var(--text);transition:transform .1s ease, filter .15s;box-shadow:0 4px 0 var(--shadow)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.go{background:var(--sun);color:var(--on-sun)}
.btn.big{font-size:20px;padding:16px 28px;border-radius:18px}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.muted{color:var(--muted)}
.panel{background:var(--night-2);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(6px)}
.banner{background:var(--sun);color:var(--on-sun);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px}

/* Landing */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-block:24px 8px}
.hero .logo{font-size:clamp(64px,13vw,132px)}
.hero p{margin:0;font-size:clamp(17px,2.2vw,21px);color:var(--muted);max-width:44ch}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.choose{grid-template-columns:minmax(0,1fr)}}
.choose .panel{display:flex;flex-direction:column;gap:14px}
.choose h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{border:2px solid var(--line);background:var(--night);color:var(--text);border-radius:14px;padding:14px 16px;font-size:20px;font-weight:800;width:100%}
.field input.code{font-family:var(--mono);letter-spacing:.3em;font-size:26px}
.field input:focus{border-color:var(--sun);outline:none}
.err{color:#B42318;font-weight:800;margin:0;min-height:1.2em}

/* Setup */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cat-tile{appearance:none;border:0;text-align:left;border-radius:18px;padding:16px;min-height:118px;background:var(--catc);color:var(--catfg);display:flex;flex-direction:column;justify-content:space-between;gap:10px;position:relative;box-shadow:0 5px 0 var(--shadow);transition:transform .12s, opacity .15s, filter .15s}
.cat-tile[aria-pressed="false"]{opacity:.38;filter:saturate(.5)}
.cat-tile:hover{transform:translateY(-2px) rotate(-.5deg)}
.cat-tile .nm{font-family:var(--display);font-size:24px;line-height:1}
.cat-tile .bl{font-weight:700;font-size:14px;opacity:.9}
.cat-tile .ct{font-family:var(--mono);font-size:12px;opacity:.85}
.cat-tile .tick{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:#0C1A3A;display:grid;place-items:center;font-weight:900;font-size:15px}
.cat-tile[aria-pressed="false"] .tick{background:rgba(0,0,0,.25);color:transparent}
.opts{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end}
.seg{display:flex;flex-direction:column;gap:6px}
.seg .lbl{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg .row{display:inline-flex;background:var(--night);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 14px;font-weight:900;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}

/* Lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:minmax(0,1fr)}}
.join-card{display:flex;flex-direction:column;gap:14px}
.join-card .how{font-size:18px;color:var(--muted)}
.join-card .url{font-family:var(--mono);font-size:15px;word-break:break-all;background:var(--night);border-radius:10px;padding:8px 12px}
.bigcode{font-family:var(--mono);font-size:clamp(56px,10vw,104px);line-height:1;letter-spacing:.08em;color:var(--sun)}
.qr{background:#fff;border-radius:16px;padding:12px;width:max-content;max-width:100%}
.qr img,.qr canvas{display:block;max-width:100%;height:auto}
.players{display:flex;flex-wrap:wrap;gap:10px}
.pchip{background:var(--pc);color:var(--pcfg);font-weight:900;font-size:18px;padding:8px 16px;border-radius:999px;animation:popin .45s cubic-bezier(.2,1.6,.4,1) both;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.count{font-family:var(--display);font-size:44px;line-height:1}

.avatars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:520px){.avatars{grid-template-columns:repeat(4,minmax(0,1fr))}}
.av{border:3px solid transparent;background:transparent;border-radius:16px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;padding:3px;transition:transform .1s}
.av svg{width:100%;height:100%;display:block}
.av:hover{transform:scale(1.06)}
.av[aria-pressed="true"]{border-color:var(--sun);background:var(--night);box-shadow:0 0 0 3px #F5C9A8;transform:scale(1.06)}
.avname{font-family:var(--display);color:var(--sun);font-size:18px;letter-spacing:0;text-transform:none}
.pchip .pa{margin-right:6px}
.face{display:inline-block;width:1.7em;height:1.7em;vertical-align:middle;flex:none}
.face.emo{width:auto;height:auto;font-size:1.15em;line-height:1}
.bigface{width:132px;height:132px;display:block;animation:popin .5s cubic-bezier(.2,1.6,.4,1) both}
.bigface.emo{width:auto;height:auto;font-size:96px;line-height:1}
.chipface{width:34px;height:34px;display:block;flex:none}
.chipface.emo{width:auto;height:auto;font-size:18px}
.pchip{display:inline-flex;align-items:center;gap:8px}
.step .face{width:clamp(64px,10vw,96px);height:clamp(64px,10vw,96px)}
/* podium moves: they start once the blocks have risen */
.dancer{position:relative;display:inline-block;transform-origin:50% 100%}
.dancer .face{display:block}
.p1 .dancer{animation:victory .9s ease-in-out 1.6s infinite}
.p2 .dancer{animation:shimmy .55s ease-in-out 1.2s infinite alternate}
.p3 .dancer{animation:hop .7s cubic-bezier(.3,0,.4,1) .9s infinite}
@keyframes victory{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-16px) rotate(-10deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-16px) rotate(10deg)}}
@keyframes shimmy{from{transform:translateX(-7px) rotate(-8deg)}to{transform:translateX(7px) rotate(8deg)}}
@keyframes hop{0%,60%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.08,.9)}30%{transform:translateY(-22px) scale(.95,1.06)}}
.crown{position:absolute;left:50%;top:-30%;width:62%;transform:translateX(-50%);animation:crowndrop .7s cubic-bezier(.3,1.6,.5,1) 1.3s both}
@keyframes crowndrop{from{transform:translate(-50%,-160%) rotate(-25deg);opacity:0}to{transform:translate(-50%,0) rotate(-8deg);opacity:1}}
.glove{position:absolute;top:38%;width:44%;animation:jab 1.2s ease-in 1.8s infinite both}
.glove.r{left:88%}
.glove.l{right:88%;transform:scaleX(-1)}
.glove.l{animation-name:jabl;animation-delay:2.4s}
@keyframes jab{0%,40%,100%{transform:translateX(0) scale(.9);opacity:0}45%{opacity:1}55%{transform:translateX(26px) scale(1.15);opacity:1}70%{transform:translateX(0) scale(.95);opacity:1}90%{opacity:0}}
@keyframes jabl{0%,40%,100%{transform:scaleX(-1) translateX(0) scale(.9);opacity:0}45%{opacity:1}55%{transform:scaleX(-1) translateX(26px) scale(1.15);opacity:1}70%{transform:scaleX(-1) translateX(0) scale(.95);opacity:1}90%{opacity:0}}
.bigface.winner{animation:popin .5s cubic-bezier(.2,1.6,.4,1) both, victory .9s ease-in-out .6s infinite;transform-origin:50% 100%}

.ai{display:flex;flex-direction:column;gap:14px;border:2px dashed var(--line);border-radius:20px;padding:18px;background:linear-gradient(135deg,rgba(255,216,77,.08),rgba(165,94,234,.1))}
.ai h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.ai .grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.ai .grid{grid-template-columns:minmax(0,1fr)}}
.ai .field input{font-size:17px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:var(--night);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;color:var(--muted)}
.chips button:hover{color:var(--text);border-color:var(--sun)}
.review{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding-right:4px}
.rq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--night);border-radius:14px;padding:10px 12px}
.rq .qq{font-weight:800}
.rq .oo{font-size:14px;color:var(--muted)}
.rq .oo b{color:var(--d)}
.rq button,.mine button{border:0;background:var(--night-3);border-radius:10px;padding:6px 10px;font-weight:900}
.mine{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mine .tag{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 6px 4px 12px;font-weight:800;background:var(--catc);color:var(--catfg)}
.mine .tag button{background:rgba(0,0,0,.2);color:inherit;padding:2px 8px;border-radius:999px}
.cat-tile .aib{position:absolute;top:12px;right:46px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.25);padding:3px 7px;border-radius:999px}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.mode{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.mode{grid-template-columns:minmax(0,1fr)}}
.mode button{border:3px solid var(--line);background:var(--night);border-radius:18px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.mode button b{font-family:var(--display);font-weight:400;font-size:22px}
.mode button span{color:var(--muted);font-size:14px;font-weight:700}
.mode button[aria-pressed="true"]{border-color:var(--sun);background:var(--night-3)}
.remote-tag{background:var(--b);color:#fff}
.confirmbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--night-3);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800}
.confirmbar .btn{padding:8px 14px;font-size:14px}
.leave{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:14px;padding:4px 6px;text-decoration:underline}
.copyrow{display:flex;gap:8px;align-items:stretch}
.copyrow .url{flex:1;min-width:0}
.rmedia .flag{max-height:130px}
.rmedia .emoji{font-size:64px}
.pcount{text-align:center;font-weight:800;color:var(--muted);margin:0}
.pbig .ansline{font-size:17px;font-weight:800;background:rgba(0,0,0,.18);border-radius:12px;padding:8px 12px}
.minibars{display:flex;flex-direction:column;gap:6px;width:100%;max-width:360px}
.minibar{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;gap:8px;align-items:center;font-weight:900;font-size:14px}
.minibar .tr{height:14px;border-radius:99px;background:rgba(0,0,0,.2);overflow:hidden}
.minibar .tr i{display:block;height:100%;border-radius:99px}
.plist{display:flex;flex-direction:column;gap:6px;width:100%}
.plist .lrow{font-size:17px;padding:8px 12px;grid-template-columns:34px minmax(0,1fr) auto}
.plist .lrow .rk{font-size:22px}
.plist .lrow.me{outline:3px solid var(--sun)}

/* Question (host) */
.qwrap{display:flex;flex-direction:column;gap:18px;flex:1}
.qhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.qstage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}
@media (max-width:760px){.qstage{grid-template-columns:minmax(0,1fr)}.qstage .ring{justify-self:center}}
.qtext{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,52px);line-height:1.08;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.media{display:flex;justify-content:center}
.emoji{font-size:clamp(64px,11vw,128px);line-height:1.1;letter-spacing:.06em;text-align:center}
.flag{max-height:190px;max-width:100%;border-radius:10px;box-shadow:0 10px 30px var(--shadow);background:#fff}
.flag-fallback{font-size:120px;line-height:1}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line)}
.ring .pr{stroke:var(--sun);transition:stroke-dashoffset .25s linear}
.ring.low .pr{stroke:var(--a)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:46px}
.answered{text-align:center}
.answered b{display:block;font-family:var(--display);font-size:46px;line-height:1}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.answers{grid-template-columns:minmax(0,1fr)}}
.ans{position:relative;border-radius:18px;padding:18px 20px;min-height:92px;display:flex;align-items:center;gap:16px;background:var(--ac);color:var(--afg);font-weight:900;font-size:clamp(18px,2.4vw,26px);box-shadow:0 6px 0 var(--shadow);overflow:hidden;transition:opacity .3s, transform .3s}
.ans .let{flex:none;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--display);font-size:28px}
.ans .tx{position:relative;overflow-wrap:anywhere}
.ans .bar{position:absolute;inset:auto 0 0 0;height:8px;background:rgba(0,0,0,.25)}
.ans .bar i{display:block;height:100%;background:rgba(255,255,255,.85);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ans .votes{margin-left:auto;font-family:var(--display);font-size:30px;position:relative}
.ans.wrong{opacity:.28;transform:scale(.97)}
.ans.right{transform:scale(1.02);box-shadow:0 0 0 5px var(--text), 0 10px 30px var(--shadow)}
.ans.right .let{background:#fff;color:#0C1A3A}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}

/* Leaderboard */
.lb{display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.lb h2,.center-h{font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,64px);margin:0;text-align:center;line-height:1}
.lrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:14px;align-items:center;background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:12px 18px;font-size:22px;font-weight:900;animation:slide .5s cubic-bezier(.2,1,.3,1) both}
.lrow:nth-child(2){animation-delay:.05s}.lrow:nth-child(3){animation-delay:.1s}.lrow:nth-child(4){animation-delay:.15s}.lrow:nth-child(5){animation-delay:.2s}.lrow:nth-child(6){animation-delay:.25s}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.lrow .rk{font-family:var(--display);font-size:30px;color:var(--sun)}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sc{font-family:var(--mono);font-variant-numeric:tabular-nums}
.plus{font-size:14px;font-weight:900;background:var(--d);color:var(--d-fg);border-radius:999px;padding:3px 10px}
.plus.zero{background:var(--night-3);color:var(--muted)}
.streak{font-size:13px;font-weight:900;color:var(--sun)}

/* Podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;max-width:760px;width:100%;margin:10px auto 0}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.step .who{font-family:var(--display);font-size:clamp(20px,3.4vw,32px);overflow-wrap:anywhere;line-height:1.05}
.step .pts{font-family:var(--mono);color:var(--muted);font-size:15px}
.step .blk{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-family:var(--display);font-size:56px;box-shadow:0 6px 0 var(--shadow);animation:rise .9s cubic-bezier(.2,1.2,.3,1) both}
.step.p1 .blk{height:200px;background:var(--sun);color:var(--on-sun);animation-delay:.6s}
.step.p2 .blk{height:150px;background:var(--b);animation-delay:.3s}
.step.p3 .blk{height:110px;background:var(--a)}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}

/* Player */
.phone{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;flex:1}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900}
.pbar .me{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pscore{font-family:var(--mono);background:var(--night-3);border-radius:10px;padding:4px 10px}
.pbig{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:26px;padding:28px 20px;min-height:320px}
.pbig h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,10vw,56px);line-height:1;margin:0}
.pbig p{margin:0;font-size:18px;font-weight:700}
.pbig.ok{background:var(--d);color:var(--d-fg)}
.pbig.no{background:var(--a);color:var(--a-fg)}
.pbig.wait{background:var(--night-2);border:1px solid var(--line)}
.pbig .pts{font-family:var(--display);font-size:52px;line-height:1}
.pq{font-weight:900;font-size:19px;text-align:center;margin:0;text-wrap:balance}
.pans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex:1}
.pbtn{border:0;border-radius:20px;min-height:128px;padding:14px;background:var(--ac);color:var(--afg);font-weight:900;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 0 var(--shadow);overflow-wrap:anywhere;transition:transform .08s}
.pbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

.hero-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nopin{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--night-2);border:2px dashed var(--sun);border-radius:18px;padding:14px 18px}
.nopin p{margin:0;font-weight:800;font-size:16px;max-width:60ch}
.nopin p b{color:var(--sun)}
.linkbtn{border:0;background:none;padding:0;color:var(--sun);font-weight:900;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.howto-veil{position:fixed;inset:0;z-index:30;background:rgba(42,31,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px, env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;animation:fadein .2s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.howto{width:100%;max-width:760px;background:var(--night-2);border:1px solid var(--line);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 80px rgba(42,31,20,.35);animation:popin .35s cubic-bezier(.2,1.4,.4,1) both}
.howto-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.howto h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,44px);line-height:1;margin:0}
.howto .lede{margin:6px 0 0;color:var(--muted);font-weight:700;font-size:17px}
.xbtn{border:2px solid var(--line);background:var(--night);border-radius:12px;width:44px;height:44px;font-size:22px;font-weight:900;line-height:1;flex:none;cursor:pointer;color:var(--text)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:step}
.steps li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start;background:var(--night);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.steps .num{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:#fff}
.steps h3{margin:2px 0 4px;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.steps p{margin:0;color:var(--text);font-size:16px;line-height:1.45}
.steps .who{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.tips{grid-template-columns:minmax(0,1fr)}}
.tip{background:var(--night-3);border-radius:16px;padding:14px 16px}
.tip b{display:block;font-size:16px;margin-bottom:4px}

.nudge{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;width:min(560px,calc(100% - 32px));background:var(--text);color:var(--night);border-radius:20px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 18px 50px rgba(42,31,20,.35);animation:nudgein .45s cubic-bezier(.2,1.4,.4,1) .6s both}
@keyframes nudgein{from{transform:translate(-50%,140%)}to{transform:translate(-50%,0)}}
.nudge p{margin:0;font-weight:800;font-size:16px;flex:1 1 220px}
.nudge p span{display:block;font-weight:700;font-size:14px;opacity:.8}
.nudge .btn{padding:10px 16px;font-size:15px}
.nudge .later{border:0;background:none;color:var(--night);font-weight:800;text-decoration:underline;cursor:pointer;font-size:14px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));background:var(--sun);color:var(--on-sun);font-weight:900;padding:12px 18px;border-radius:14px;max-width:calc(100% - 32px);z-index:21;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);

function liveApi(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data || {}; };
  async function load(id){
    const [g, p, a] = await Promise.all([
      sb.from("quiz_games").select("id,code,status,q_index,q_started_at,q_seconds,questions,remote").eq("id", id).single(),
      sb.from("quiz_players").select("id,name,avatar,score,streak,last_points,joined_at").eq("game_id", id).order("joined_at"),
      sb.from("quiz_answers").select("player_id,q_index,choice,correct,points").eq("game_id", id)
    ]);
    if (g.error) throw g.error;
    return { game: g.data, players: p.data || [], answers: a.data || [] };
  }
  return {
    createGame: (qs, secs, token, remote) => rpc("quiz_create_game", { p_questions: qs, p_seconds: secs, p_token: token, p_remote: !!remote }),
    leave: (pid, token) => rpc("quiz_leave", { p_player: pid, p_token: token }),
    join: (code, name, token, avatar) => rpc("quiz_join", { p_code: code, p_name: name, p_token: token, p_avatar: avatar }),
    hostSet: (id, token, status, idx) => rpc("quiz_host_set", { p_game: id, p_token: token, p_status: status, p_index: idx }),
    answer: (pid, token, idx, choice) => rpc("quiz_answer", { p_player: pid, p_token: token, p_q_index: idx, p_choice: choice }),
    async generate(topic, count, difficulty, hostCode){
      const headers = { "x-device-id": deviceId };
      if (hostCode) headers["x-host-code"] = hostCode;
      const { data, error } = await sb.functions.invoke("generate-quiz", { body: { topic, count, difficulty }, headers });
      if (error){
        let code = "server_error";
        try { const b = await error.context.json(); code = b.error || code; } catch(e){ if (error.name === "FunctionsFetchError" || error.name === "FunctionsRelayError") code = "no_function"; }
        return { error: code };
      }
      return data;
    },
    load,
    subscribe(id, cb){
      let t = null, dead = false;
      const go = () => { clearTimeout(t); t = setTimeout(async () => { if (dead) return; try { cb(await load(id)); } catch(e){ if (e && e.code === "PGRST116") cb({ gone: true }); } }, 120); };
      const ch = sb.channel("quiz-" + id)
        .on("postgres_changes", { event:"*", schema:"public", table:"quiz_games",   filter:`id=eq.${id}` }, go)
        .on("postgres_changes", { event:"*", schema:"public", table:"quiz_players", filter:`game_id=eq.${id}` }, go)
        .on("postgres_changes", { event:"*", schema:"public", table:"quiz_answers", filter:`game_id=eq.${id}` }, go)
        .subscribe();
      go();
      const iv = setInterval(go, 3500);
      return { refresh: go, stop(){ dead = true; clearInterval(iv); clearTimeout(t); sb.removeChannel(ch); } };
    }
  };
}

function demoApi(){
  const games = {}; const listeners = {};
  const snap = id => JSON.parse(JSON.stringify(games[id]));
  const emit = id => (listeners[id] || []).forEach(cb => cb(snap(id)));
  const BOTS = ["Ada","Tobi","Kemi","Sam","Jo","Ngozi"];
  function answerFor(id, pid, idx, choice){
    const st = games[id], g = st.game, p = st.players.find(x => x.id === pid);
    if (g.status !== "question" || g.q_index !== idx) return { status:"closed" };
    if (st.answers.some(a => a.player_id === pid && a.q_index === idx)) return { status:"already" };
    const ms = Math.min(Date.now() - Date.parse(g.q_started_at), g.q_seconds*1000);
    const ok = g.questions[idx].a === choice;
    const streak = ok ? p.streak + 1 : 0, pts = scoreFor(ms, g.q_seconds, ok, streak);
    st.answers.push({ player_id:pid, q_index:idx, choice, correct:ok, points:pts });
    p.score += pts; p.streak = streak; p.last_points = pts;
    emit(id); return { status:"ok", correct:ok, points:pts, streak };
  }
  return {
    async createGame(qs, secs, token, remote){
      const id = "demo-" + Date.now(), code = String(100000 + Math.floor(Math.random()*900000));
      games[id] = { game:{ id, code, status:"lobby", q_index:-1, q_started_at:null, q_seconds:secs, questions:qs, remote:!!remote }, players:[], answers:[] };
      BOTS.forEach((n,i) => setTimeout(() => { if (games[id].game.status !== "lobby") return; games[id].players.push({ id:"bot"+i, name:n, avatar:AVATARS[(i*5+3)%AVATARS.length], score:0, streak:0, last_points:0 }); emit(id); }, 700 + i*650));
      return { status:"ok", id, code };
    },
    async join(){ return { status:"demo" }; },
    async leave(){ return { status:"ok" }; },
    async generate(){ return { error:"demo" }; },
    async hostSet(id, token, status, idx){
      const st = games[id], g = st.game;
      if (status === "question"){
        g.status = "question"; g.q_index = idx; g.q_started_at = new Date().toISOString();
        st.players.forEach(p => {
          const smart = 0.45 + (hash(p.name) % 40) / 100;
          const delay = 1200 + Math.random() * g.q_seconds * 700;
          setTimeout(() => {
            const q = g.questions[idx];
            const choice = Math.random() < smart ? q.a : Math.floor(Math.random()*4);
            answerFor(id, p.id, idx, choice);
          }, delay);
        });
      } else if (status === "reveal"){
        st.players.forEach(p => { if (!st.answers.some(a => a.player_id === p.id && a.q_index === g.q_index)){ p.streak = 0; p.last_points = 0; } });
        g.status = "reveal";
      } else g.status = status;
      emit(id); return { status:"ok" };
    },
    async answer(pid, token, idx, choice){ return { status:"closed" }; },
    async load(id){ return snap(id); },
    subscribe(id, cb){
      (listeners[id] = listeners[id] || []).push(cb);
      cb(snap(id));
      return { refresh(){ cb(snap(id)); }, stop(){ listeners[id] = (listeners[id]||[]).filter(f => f !== cb); } };
    }
  };
}

async function generateCategory(){
  const topic = gen.topic.trim();
  if (topic.length < 2){ gen.err = "Type a topic first, like “Arsenal” or “Nigerian slang”."; render(); return; }
  gen.busy = true; gen.err = ""; render();
  try{
    const r = await api.generate(topic, gen.count, gen.diff, gen.code);
    const msg = {
      demo: "AI questions work on your hosted version (with Supabase). This preview can't reach it.",
      wrong_code: "That host code doesn't match. Check it, or remove it to use the free daily rounds.",
      user_limit: "You've used your free AI rounds for today. Come back tomorrow, or play the built-in categories.",
      network_limit: "This network has used its free AI rounds for today. Come back tomorrow, or play the built-in categories.",
      site_limit: "AI rounds are all used up for today. Come back tomorrow, or play the built-in categories.",
      limits_unavailable: "AI rounds are paused right now. Try again later.",
      no_api_key: "The AI key isn't set yet. Add OPENAI_API_KEY in Supabase Edge Function secrets.",
      no_function: "The generate-quiz function isn't deployed yet. See the setup steps.",
      bad_topic: "Try a slightly longer topic.",
      ai_error: "The AI service had a problem. Try again in a moment.",
      empty: "The AI didn't return usable questions. Try rewording the topic.",
      server_error: "Something went wrong generating questions. Try again."
    }[r.error];
    if (r.error === "wrong_code"){ gen.code = ""; store.set("oya.hostcode", ""); }
    if (msg){ gen.err = msg; return; }
    const [c, fg] = CHIP[(customCats.length + 3) % CHIP.length];
    const cat = { id: "ai" + Date.now().toString(36), name: r.name || topic.slice(0,24), blurb: `AI round: ${topic}`, c, fg, questions: r.questions };
    customCats.push(cat); store.set("oya.custom", customCats);
    setup.cats.add(cat.id); gen.review = cat.id; gen.topic = "";
    gen.left = r.host ? null : (typeof r.left === "number" ? r.left : null);
    toast(`${r.questions.length} questions added.${gen.left !== null ? ` ${gen.left} free AI ${gen.left===1?"round":"rounds"} left today.` : ""}`);
  }catch(e){ gen.err = "Couldn't reach the AI. Check your connection and try again."; }
  finally{ gen.busy = false; render(); }
}

function watch(id){
  if (sub) sub.stop();
  sub = api.subscribe(id, st => { S = st; onState(); });
}
function stopWatch(){ if (sub) sub.stop(); sub = null; S = null; }

function onState(){
  if (S && S.gone){
    stopWatch();
    if (role === "player"){ store.set("oya.player", null); playerSess = null; }
    else { store.set("oya.host", null); hostSess = null; }
    role = null; lastView = ""; render(); toast("That game no longer exists.");
    return;
  }
  if (!S || !S.game) return;
  const g = S.game;
  if (g.status === "question" && qClock.idx !== g.q_index){
    const server = Date.parse(g.q_started_at), now = Date.now();
    qClock = { idx: g.q_index, start: Math.abs(now - server) < 5000 ? Math.min(server, now) : now };
  }
  render();
}

/* ─── HOST ACTIONS ─── */
async function createGame(){
  const pool = shuffle(allQuestions().filter(q => setup.cats.has(q.c)));
  // spread categories evenly instead of letting one dominate
  const byCat = {}; pool.forEach(q => (byCat[q.c] = byCat[q.c] || []).push(q));
  const mixed = []; let added = true;
  while (added){ added = false; for (const k of shuffle(Object.keys(byCat))){ const q = byCat[k].shift(); if (q){ mixed.push(q); added = true; } } }
  const picked = mixed.slice(0, setup.count).map(q => {
    const order = shuffle([0,1,2,3]);
    const ai = customCats.find(k => k.id === q.c);
    return { c:q.c, cn: ai ? ai.name : null, q:q.q, o:order.map(i => q.o[i]), a:order.indexOf(q.a), e:q.e || null, f:q.f || null };
  });
  const token = uuid();
  $("createBtn").disabled = true;
  try{
    const r = await api.createGame(picked, setup.secs, token, setup.remote);
    if (r.status !== "ok") throw new Error(r.status);
    hostSess = { gameId: r.id, token, code: r.code };
    if (LIVE) store.set("oya.host", hostSess);
    role = "host"; revealing = -1; qClock = { idx:-1, start:0 };
    watch(r.id);
  }catch(e){ toast("Couldn't create the game. Check your connection and try again."); $("createBtn").disabled = false; }
}
async function hostSet(status, idx){
  try{
    const r = await api.hostSet(hostSess.gameId, hostSess.token, status, idx);
    if (r.status !== "ok") toast("Only the host screen can control this game.");
    sub && sub.refresh();
  }catch(e){ toast("Connection hiccup. Tap again."); }
}
function hostTick(){
  if (role !== "host" || !S || S.game.status !== "question") return;
  const g = S.game, left = Math.max(0, g.q_seconds - (Date.now() - qClock.start)/1000);
  const ring = document.querySelector(".ring");
  if (ring){
    ring.querySelector(".num").textContent = Math.ceil(left);
    ring.querySelector(".pr").style.strokeDashoffset = String(314.16 * (1 - left / g.q_seconds));
    ring.classList.toggle("low", left <= 5);
  }
  const answered = S.answers.filter(a => a.q_index === g.q_index).length;
  if ((left <= 0 || (S.players.length && answered >= S.players.length)) && revealing !== g.q_index){
    revealing = g.q_index; ding(); hostSet("reveal", g.q_index);
  }
}
setInterval(hostTick, 250);

/* ─── PLAYER ACTIONS ─── */
async function joinGame(code, name){
  const err = $("joinErr");
  if (!LIVE){ err.textContent = "Joining works once the game is hosted with Supabase. In this preview, try hosting instead."; return; }
  if (!code){ err.innerHTML = `Enter the game PIN from the host’s screen. No PIN yet? Someone has to host first. <button type="button" class="linkbtn" data-act="howto">How to play</button>`; return; }
  if (!/^\d{6}$/.test(code)){ err.textContent = "The game PIN is 6 digits."; return; }
  if (!name){ err.textContent = "Add your name so the host can see you."; return; }
  const token = uuid();
  $("joinBtn").disabled = true;
  try{
    store.set("oya.avatar", myAvatar);
    const r = await api.join(code, name, token, myAvatar);
    const msg = { no_game:"No game with that PIN. Check the big screen.", finished:"That game has finished.", name_taken:"Someone's already using that name. Try another.", bad_name:"Names can be up to 24 characters.", full:"This game is full." }[r.status];
    if (msg){
      err.textContent = msg;
      if (r.status === "no_game"){ err.insertAdjacentHTML("beforeend", ` Games are created by the host, who gets the PIN. <button type="button" class="linkbtn" data-act="howto">How to play</button>`); }
      $("joinBtn").disabled = false; return;
    }
    playerSess = { gameId: r.game_id, playerId: r.player_id, token, name, code };
    store.set("oya.player", playerSess);
    role = "player"; watch(r.game_id);
  }catch(e){ err.textContent = "Couldn't connect. Check your signal and try again."; $("joinBtn").disabled = false; }
}
async function leaveGame(){
  const sess = playerSess;
  stopWatch(); store.set("oya.player", null); playerSess = null; role = null; lastView = ""; confirm = null;
  history.replaceState(null, "", location.pathname);
  render(); toast("You left the game.");
  try{ if (sess) await api.leave(sess.playerId, sess.token); }catch(e){}
}
async function answer(choice){
  const g = S.game;
  if (pendingChoice !== null) return;
  pendingChoice = choice; render();
  try{
    const r = await api.answer(playerSess.playerId, playerSess.token, g.q_index, choice);
    if (r.status === "ok"){
      myResults[g.id] = myResults[g.id] || {};
      myResults[g.id][g.q_index] = { correct: r.correct, points: r.points, streak: r.streak };
      store.set("oya.results", myResults);
    } else if (r.status === "too_late" || r.status === "closed") toast("Time's up for that one!");
  }catch(e){ toast("That didn't send. Tap again quickly!"); pendingChoice = null; render(); return; }
  sub && sub.refresh();
}

function render(){
  const app = $("app");
  if (role) $("nudge")?.remove();
  if (!role) return renderLanding(app);
  if (role === "setup") return renderSetup(app);
  if (!S) { app.innerHTML = `<div class="pbig wait"><div class="spinner"></div><p>Connecting…</p></div>`; return; }
  if (role === "host") return renderHost(app);
  return renderPlayer(app);
}

function answerTiles(q, mode, counts){
  const total = counts ? counts.reduce((s,n)=>s+n,0) : 0;
  return `<div class="answers">${q.o.map((o,i) => {
    const cls = mode === "reveal" ? (i === q.a ? "right" : "wrong") : "";
    return `<div class="ans ${cls}" style="--ac:${ANS[i].c};--afg:${ANS[i].fg}">
      <span class="let">${mode === "reveal" && i === q.a ? "✓" : ANS[i].l}</span><span class="tx">${esc(o)}</span>
      ${mode === "reveal" ? `<span class="votes">${counts[i]}</span><span class="bar"><i style="width:${total ? counts[i]/total*100 : 0}%"></i></span>` : ""}
    </div>`; }).join("")}</div>`;
}
function media(q){
  if (q.e) return `<div class="media"><div class="emoji" aria-label="Emoji clue">${q.e}</div></div>`;
  if (q.f) return `<div class="media"><img class="flag" src="https://flagcdn.com/w640/${q.f}.png" alt="A country flag" onerror="this.outerHTML='<div class=&quot;flag-fallback&quot;>${flagEmoji(q.f)}</div>'"></div>`;
  return "";
}
function ranked(){ return [...S.players].sort((a,b) => b.score - a.score || a.name.localeCompare(b.name)); }

}

function renderPlayer(app){
  const g = S.game, me = S.players.find(p => p.id === playerSess.playerId);
  if (!me){ app.innerHTML = `<div class="phone"><div class="pbig wait"><h2>You're not in this game</h2><p>You may have left, or the host started a new one. Ask for the PIN to join again.</p><button class="btn go" data-act="leave">Back</button></div></div>`; return; }
  const view = `${g.status}|${g.q_index}`;
  if (view !== lastView){ lastView = view; pendingChoice = null; }
  const R = g.remote;
  const rk = ranked();
  const rankIdx = rk.findIndex(p => p.id === me.id) + 1;
  const bar = `<div class="pbar"><span class="me">${face(me)} ${esc(me.name)}</span><span style="display:flex;gap:8px;align-items:center"><span class="pscore">${me.score.toLocaleString()}</span><button class="leave" data-act="askLeave">Leave</button></span></div>

  const q = g.q_index >= 0 ? g.questions[g.q_index] : null;
  const cat = q ? catOf(q.c) : null;
  const mine = S.answers.find(a => a.player_id === me.id && a.q_index === g.q_index);
  const local = (myResults[g.id] || {})[g.q_index];
  const answeredN = q ? S.answers.filter(a => a.q_index === g.q_index).length : 0;
  const head = q ? `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="pill">Q${g.q_index+1} of ${g.questions.length}</span><span class="pill cat" style="--catc:${cat.c};--catfg:${cat.fg}">${esc(cat.name)}</span></div>` : "";
  const board = (n) => `<div class="plist">${rk.slice(0, n).map((p,i) => `<div class="lrow ${p.id===me.id?"me":""}"><span class="rk">${i+1}</span><span class="nm">${face(p)} ${esc(p.name)}</span><span class="sc">${p.score.toLocaleString()}</span></div>`).join("")}${rankIdx > n ? `<div class="lrow me"><span class="rk">${rankIdx}</span><span class="nm">${face(me)} ${esc(me.name)}</span><span class="sc">${me.score.toLocaleString()}</span></div>` : ""}</div>`;
  const setView = v => { app.dataset.view = v; };

  if (g.status === "lobby"){
    setView("");
    app.innerHTML = `<div class="phone">${bar}<div class="pbig wait">${avatarSVG(me.avatar, "bigface")}<h2>You're in!</h2>
      <p>${R ? "The game starts on your phone when the host is ready." : "Look for your name on the big screen."}</p><div class="spinner"></div>
      <p class="muted">Game ${esc(g.code)} · ${S.players.length} ${S.players.length===1?"player":"players"}${R ? " · Remote" : ""}</p>
      ${R ? `<div class="players" style="justify-content:center">${S.players.map(p => `<span class="pchip" style="${chipStyle(p.name)};font-size:15px">${avatarSVG(p.avatar, "chipface")}${esc(p.name)}</span>`).join("")}</div>` : ""}
    </div></div>`; return;
  }
  if (g.status === "question"){
    if (mine || pendingChoice !== null){
      const ch = mine ? mine.choice : pendingChoice;
      const key = `locked|${view}|${answeredN}|${confirm||""}`;
      if (app.dataset.view === key) return; setView(key);
      app.innerHTML = `<div class="phone">${bar}<div class="pbig" style="background:${ANS[ch].c};color:${ANS[ch].fg}"><h2>Locked in!</h2><p>You picked ${ANS[ch].l}${R ? `: ${esc(q.o[ch])}` : ""}. Fingers crossed…</p><div class="spinner"></div>${R ? `<p>${answeredN} of ${S.players.length} answered</p>` : ""}</div></div>`; return;
    }
    const key = `ask|${view}|${confirm||""}`;
    if (app.dataset.view === key){ const c = document.getElementById("pAnswered"); if (c) c.textContent = `${answeredN} of ${S.players.length} answered`; return; }
    setView(key);
    app.innerHTML = `<div class="phone">${bar}${R ? head : ""}
      <div class="ptimer"><i id="pTimer" style="width:100%"></i></div>
      ${R ? `<div class="rmedia">${media(q)}</div>` : (q.e ? `<div class="emoji" style="font-size:56px">${q.e}</div>` : "")}
      <p class="pq" ${R ? `style="font-size:22px"` : ""}>${esc(q.q)}</p>
      <div class="pans" id="pAns">${q.o.map((o,i) => `<button class="pbtn" style="--ac:${ANS[i].c};--afg:${ANS[i].fg}" data-choice="${i}"><span class="let">${ANS[i].l}</span>${esc(o)}</button>`).join("")}</div>
      ${R ? `<p class="pcount" id="pAnswered">${answeredN} of ${S.players.length} answered</p>` : ""}
    </div>`;
    return;
  }
  setView("");
  if (g.status === "reveal"){
    const ok = mine ? mine.correct : false, pts = mine ? mine.points : 0;
    const streak = local ? local.streak : me.streak;
    const title = !mine ? "Too slow!" : ok ? "Correct!" : "Not quite";
    const sub2 = !mine ? "You didn't answer in time." : ok ? (streak >= 2 ? `${streak} in a row!` : "Nice one.") : "";
    let extra = "";
    if (R){
      const counts = [0,0,0,0]; S.answers.filter(a => a.q_index === g.q_index).forEach(a => counts[a.choice]++);
      const max = Math.max(1, ...counts);
      extra = `<div class="ansline">✓ ${ANS[q.a].l}: ${esc(q.o[q.a])}</div>
        <div class="minibars">${counts.map((n,i) => `<div class="minibar"><span>${ANS[i].l}</span><span class="tr"><i style="width:${n/max*100}%;background:${ANS[i].c};${i===q.a?"outline:2px solid #2A1F14":""}"></i></span><span>${n}</span></div>`).join("")}</div>`;
    } else if (mine && !ok){
      extra = `<p>It was ${ANS[q.a].l}: ${esc(q.o[q.a])}</p>`;
    }
    app.innerHTML = `<div class="phone">${bar}${R ? head : ""}<div class="pbig ${ok ? "ok" : "no"}"><h2>${title}</h2><div class="pts">+${pts}</div>${sub2 ? `<p>${sub2}</p>` : ""}${extra}<p>You're ${ordinal(rankIdx)}</p></div></div>`;
    if (ok && view !== app.dataset.burst){ app.dataset.burst = view; burst(); }
    return;
  }
  if (g.status === "leaderboard"){
    const ahead = rk[rankIdx - 2];
    app.innerHTML = `<div class="phone">${bar}
      <div class="pbig wait" style="min-height:0"><h2>You're ${ordinal(rankIdx)}</h2><p>${ahead ? `${(ahead.score - me.score).toLocaleString()} points behind ${esc(ahead.name)}` : "Top of the board. Stay sharp!"}</p></div>
      ${R ? board(5) : `<div class="spinner" style="margin:0 auto"></div>`}
    </div>`; return;
  }
  if (g.status === "finished"){
    const msg = rankIdx === 1 ? "Champion!" : rankIdx <= 3 ? "On the podium!" : "Good game!";
    app.innerHTML = `<div class="phone">${bar}<div class="pbig ${rankIdx <= 3 ? "ok" : "wait"}" style="min-height:0">${rankIdx <= 3 ? `<div class="p${rankIdx}">${dancer(me, rankIdx).replace('class="face"', 'class="face" style="width:120px;height:120px"')}</div>` : ""}<h2>${msg}</h2><div class="pts">${ordinal(rankIdx)}</div><p>${me.score.toLocaleString()} points</p></div>
      ${R ? `<h3 class="logo" style="font-size:26px;text-align:center">Final standings</h3>${board(10)}` : ""}
      <button class="btn go" data-act="leave" style="align-self:center">Done</button></div>`;
    if (app.dataset.burst !== "final"){ app.dataset.burst = "final"; if (rankIdx <= 3){ burst(); if (R) fanfare(); } }
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.remote !== undefined){ setup.remote = b.dataset.remote === "1"; store.set("oya.remote", setup.remote); render(); return; }
  if (b.dataset.copy){ const t = b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Link copied. Paste it in the group chat!"), () => toast("Couldn't copy. Press and hold the link to copy it.")); return; }
  if (b.dataset.idea){ gen.topic = b.dataset.idea; render(); return; }
  if (b.dataset.gcount){ gen.count = +b.dataset.gcount; render(); return; }
  if (b.dataset.gdiff){ gen.diff = b.dataset.gdiff; render(); return; }
  if (b.dataset.review !== undefined){ gen.review = b.dataset.review || null; render(); return; }
  if (b.dataset.delcat){ customCats = customCats.filter(c => c.id !== b.dataset.delcat); setup.cats.delete(b.dataset.delcat); if (gen.review === b.dataset.delcat) gen.review = null; store.set("oya.custom", customCats); render(); return; }
  if (b.dataset.delq !== undefined){ const c = customCats.find(x => x.id === gen.review); if (c){ c.questions.splice(+b.dataset.delq, 1); if (!c.questions.length){ customCats = customCats.filter(x => x !== c); setup.cats.delete(c.id); gen.review = null; } store.set("oya.custom", customCats); } render(); return; }
  if (b.id === "genBtn"){ generateCategory(); return; }
  if (b.dataset.cat){ setup.cats.has(b.dataset.cat) ? setup.cats.delete(b.dataset.cat) : setup.cats.add(b.dataset.cat); render(); return; }
  if (b.dataset.count){ setup.count = +b.dataset.count; render(); return; }
  if (b.dataset.secs){ setup.secs = +b.dataset.secs; render(); return; }
  if (b.dataset.av){ myAvatar = b.dataset.av; store.set("oya.avatar", myAvatar); document.querySelectorAll(".av").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.av === myAvatar))); const n = $("avName"); if (n && MOOD_BY_ID[myAvatar]) n.textContent = MOOD_BY_ID[myAvatar].label; return; }
  if (b.dataset.choice !== undefined){ answer(+b.dataset.choice); return; }
  if (b.id === "toSetup"){ role = "setup"; render(); return; }
  if (b.id === "createBtn"){ createGame(); return; }
  if (b.id === "resumeHost"){ role = "host"; watch(hostSess.gameId); return; }
  const g = S && S.game;
  switch (b.dataset.act){
    case "home": role = null; render(); break;
    case "howto": openHowTo(); break;
    case "howtoClose": closeHowTo(); break;
    case "howtoHavePin": closeHowTo(true); break;
    case "howtoHost": closeHowTo(); role = "setup"; render(); window.scrollTo(0, 0); break;
    case "nudgeOff": store.set("oya.seenHowTo", true); $("nudge")?.remove(); break;
    case "demoPodium": {
      if (LIVE) break;
      const ppl = [["Tobi","bigboss",9420],["Kemi","sideeye",8870],["Ada","maincharacter",8310],["Sam","unbothered",6200],["Jo","cryinglaugh",5100]]
        .map(([name, avatar, score], i) => ({ id:"d"+i, name, avatar, score, streak:0, last_points:0 }));
      hostSess = { gameId:"demo-podium", token:"x", code:"000000" };
      role = "host"; lastView = ""; delete $("app").dataset.celebrated;
      S = { game:{ id:"demo-podium-"+Date.now(), code:"000000", status:"finished", q_index:14, q_seconds:20, questions:[], remote:false }, players:ppl, answers:[] };
      render(); break;
    }
    case "showCode": gen.showCode = true; render(); setTimeout(() => $("genCode") && $("genCode").focus(), 0); break;
    case "saveCode": { const v = ($("genCode").value || "").trim(); if (!v) break; gen.code = v; gen.showCode = false; gen.err = ""; store.set("oya.hostcode", v); render(); toast("Host code saved on this device."); break; }
    case "clearCode": gen.code = ""; store.set("oya.hostcode", ""); render(); break;
    case "askLeave": confirm = "leave"; render(); break;
    case "askEnd": confirm = "end"; render(); break;
    case "noConfirm": confirm = null; render(); break;
    case "leaveNow": leaveGame(); break;
    case "endNow": confirm = null; revealing = g.q_index; hostSet("finished", g.q_index); break;
    case "all": allCats().forEach(c => setup.cats.add(c.id)); render(); break;
    case "none": setup.cats.clear(); render(); break;
    case "start": hostSet("question", 0); break;
    case "skip": revealing = g.q_index; hostSet("reveal", g.q_index); break;
    case "board": hostSet("leaderboard", g.q_index); break;
    case "next": hostSet("question", g.q_index + 1); break;
    case "finish": hostSet("finished", g.q_index); break;
    case "endHost": hostSet("finished", g.q_index); stopWatch(); store.set("oya.host", null); hostSess = null; role = "setup"; render(); break;
    case "again": stopWatch(); store.set("oya.host", null); hostSess = null; role = "setup"; lastView = ""; render(); break;
    case "leave": confirm = null; stopWatch(); store.set("oya.player", null); playerSess = null; role = null; lastView = ""; history.replaceState(null, "", location.pathname); render(); break;
  }
});

/* ─── sound + confetti ─── */
let actx = null;
function audio(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); return actx; }catch(e){ return null; } }
document.addEventListener("pointerdown", () => audio(), { once:true });
function tone(freqs, gap=0.1, len=0.35, type="triangle"){
  const a = audio(); if (!a) return;
  freqs.forEach((f,i) => { const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+i*gap;
    o.type=type; o.frequency.value=f; o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.start(t); o.stop(t+len+0.05); });
}
const ding = () => tone([659.25, 987.77], 0.12, 0.4);
const fanfare = () => tone([523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5], 0.14, 0.45);

const cv = $("confetti"), cx = cv.getContext("2d");
let bits = [], raf = null;
function burst(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const cols = CHIP.map(c => c[0]);
  for (let i = 0; i < 160; i++) bits.push({ x: innerWidth*(0.2+Math.random()*0.6), y: innerHeight*0.3, vx:(Math.random()-.5)*16, vy:-Math.random()*13-4, w:6+Math.random()*7, h:8+Math.random()*9, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i%cols.length], life:0 });
  if (!raf) raf = requestAnimationFrame(frame);
}
function frame(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  bits = bits.filter(b => b.y < innerHeight+40 && b.life < 280);
  for (const b of bits){ b.vy += .3; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle=b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h*Math.abs(Math.cos(b.r))); cx.restore(); }
  raf = bits.length ? requestAnimationFrame(frame) : (cx.clearRect(0,0,innerWidth,innerHeight), null);
}

/* ─── boot ─── */
window.addEventListener("error", () => {
  const app = $("app");
  if (app && !app.children.length) app.innerHTML = `<div class="pbig wait"><h2>Something went wrong</h2><p>Refresh the page to try again.</p></div>`;
});
(function boot(){
  const code = new URLSearchParams(location.search).get("join");
  if (LIVE && playerSess && (!code || code === playerSess.code)){ role = "player"; render(); watch(playerSess.gameId); return; }
  render();
})();
</script>
