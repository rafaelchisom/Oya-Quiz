<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Oya Quiz Stats</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&family=Space+Mono:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  color-scheme:dark;
  --night:#0C1A3A; --night-2:#132552; --night-3:#1B3170; --line:#2A4185; --grid:#1F3470;
  --text:#F5F7FF; --muted:#A9B6E0; --faint:#7F8DBB;
  --sun:#FFD84D; --bar:#FFC93C; --bar-hover:#FFE08A;
  --good:#2ED573; --bad:#FF6B7A; --blue:#4DA3FF;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1}
.logo .o{color:var(--sun)} .logo small{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:10px;vertical-align:middle}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--night-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:800;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:#231A00}
.btn{border:1px solid var(--line);background:var(--night-2);border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--night-3)}
.btn.go{background:var(--sun);color:#231A00;border-color:var(--sun)}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--sun);color:#231A00;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}

.card{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 2px}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* bar chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--faint);font-size:11px;font-family:var(--mono)}
.chart .b{fill:var(--bar)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .b,.chart g.col:hover .b{fill:var(--bar-hover)}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--night);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:800;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter .t{flex:1;height:8px;background:var(--night);border-radius:99px;overflow:hidden}
.meter .t i{display:block;height:100%;border-radius:99px;background:var(--bar)}
.acc{font-weight:900}
.acc.hi{color:var(--good)} .acc.lo{color:var(--bad)}
.tag{display:inline-block;background:var(--night-3);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;margin:2px 4px 2px 0;white-space:nowrap}
.tag.remote{background:var(--blue);color:#001633}
.tag.fail{background:var(--bad);color:#2B0008}
.empty{color:var(--muted);padding:12px 0;margin:0}
.who{display:flex;align-items:center;gap:8px;font-weight:800}
.who .av{font-size:20px;line-height:1}

/* login */
.login{max-width:420px;margin:10vh auto 0;display:flex;flex-direction:column;gap:14px}
.login input{width:100%;background:var(--night);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px}
.login input:focus{border-color:var(--sun);outline:none}
.err{color:var(--bad);font-weight:800;margin:0;min-height:1.2em}
.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:700;font-size:14px}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

async function load(){
  if (!LIVE){ data = sample(); render(); return; }
  if (!code){ renderLogin(); return; }

  if (error){ renderLogin("Couldn't load stats. Check that analytics-setup.sql has been run."); return; }
  if (r.status === "wrong_code"){ keep.clear(); code = ""; renderLogin("That passcode isn't right."); return; }
  if (r.status === "no_code_set"){ renderLogin("No admin passcode set yet. Run quiz_set_admin_code in the Supabase SQL editor."); return; }
  data = r; render();
}

}

function barChart(rows){
  const W = 720, H = 220, padL = 28, padB = 24, padT = 8;
  const max = Math.max(1, ...rows.map(r => r.games));
  const step = max <= 4 ? 1 : Math.ceil(max / 4);
  const top = Math.ceil(max / step) * step;
  const iw = W - padL, ih = H - padB - padT;
  const bw = iw / rows.length, barW = Math.max(3, Math.min(26, bw - 3));
  const y = v => padT + ih - (v / top) * ih;
  let grid = "";
  for (let v = 0; v <= top; v += step) grid += `<line class="gl" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const labelEvery = Math.ceil(rows.length / 7);
  const cols = rows.map((r, i) => {
    const x = padL + i * bw + (bw - barW) / 2, h = (r.games / top) * ih;
    const d = new Date(r.day + "T12:00:00");
    const lab = i % labelEvery === 0 ? `<text class="ax" x="${x + barW/2}" y="${H - 6}" text-anchor="middle">${d.toLocaleDateString(undefined,{day:"numeric",month:"short"})}</text>` : "";
    const radius = Math.min(4, barW/2, h/2);
    const path = h > 0 ? `<path class="b" d="M${x},${y(0)} V${y(r.games)+radius} Q${x},${y(r.games)} ${x+radius},${y(r.games)} H${x+barW-radius} Q${x+barW},${y(r.games)} ${x+barW},${y(r.games)+radius} V${y(0)} Z"/>` : "";
    return `<g class="col" data-i="${i}"><rect class="hit" x="${padL + i*bw}" y="${padT}" width="${bw}" height="${ih}"/>${path}${lab}</g>`;
  }).join("");
  return `<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Games played per day">${grid}${cols}</svg><div class="tip" id="tip"></div></div>`;
}

      <div class="kpi"><span class="l">People</span><span class="v">${nf(t.unique_players)}</span><span class="s">${nf(t.player_joins)} joins · avg ${t.avg_players ?? 0} per game</span></div>
      <div class="kpi"><span class="l">Answers</span><span class="v">${nf(t.answers)}</span><span class="s">${pct(t.accuracy)} correct overall</span></div>

      <div class="kpi"><span class="l">AI rounds</span><span class="v">${nf(t.ai_rounds)}</span><span class="s">${nf(t.ai_today ?? 0)} free rounds used today</span></div>
    </div>
    <section class="card">
      <h2>Games per day</h2><p class="sub">Last ${d.days} days · ${nf(t.all_time_games)} games and ${nf(t.all_time_players)} people all time</p>
      ${barChart(d.per_day)}
    </section>
    <div class="grid2">
      <section class="card">
        <h2>Categories</h2><p class="sub">How often each was picked, and how people did</p>
        ${d.categories.length ? `<div class="tw"><table>
          <thead><tr><th>Category</th><th>Picked in</th><th class="n">Answers</th><th class="n">Correct</th><th class="n">Avg time</th></tr></thead>
          <tbody>${d.categories.map(c => `<tr><td><b>${esc(c.name)}</b></td>
            <td><div class="meter"><span class="t"><i style="width:${c.games/catMax*100}%"></i></span><span class="n" style="font-family:var(--mono);font-size:13px">${nf(c.games)}</span></div></td>
            <td class="n">${nf(c.answers)}</td><td class="n"><span class="acc ${accCls(c.accuracy)}">${pct(c.accuracy)}</span></td><td class="n">${c.avg_secs == null ? "–" : c.avg_secs + "s"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No games yet in this period.</p>`}
      </section>
      <section class="card">
        <h2>Players</h2><p class="sub">Grouped by name</p>
        ${d.players.length ? `<div class="tw"><table>
          <thead><tr><th>Name</th><th class="n">Games</th><th class="n">Wins</th><th class="n">Podiums</th><th class="n">Points</th><th>Last played</th></tr></thead>
          <tbody>${d.players.map(p => `<tr><td><span class="who"><span class="av" aria-hidden="true">${esc(p.avatar || "🙂")}</span>${esc(p.name)}</span></td><td class="n">${nf(p.games)}</td><td class="n">${nf(p.wins)}</td><td class="n">${nf(p.podiums)}</td><td class="n">${nf(p.points)}</td><td class="note">${ago(p.last_played)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Nobody has played in this period.</p>`}
      </section>
    </div>
    <section class="card">
      <h2>Recent games</h2><p class="sub">Newest first</p>
      ${d.recent_games.length ? `<div class="tw"><table>
        <thead><tr><th>When</th><th>PIN</th><th>Categories</th><th class="n">Qs</th><th class="n">Players</th><th>Winner</th></tr></thead>
        <tbody>${d.recent_games.map(g => `<tr><td style="white-space:nowrap">${dt(g.created_at)}${g.remote ? ` <span class="tag remote">Remote</span>` : ""}</td><td class="n" style="text-align:left">${esc(g.code)}</td>

          <td class="n">${g.players_joined}${g.players_left ? ` <span class="note">(${g.players_left} left)</span>` : ""}</td>
          <td>${g.winner ? `<b>${esc(g.winner)}</b> <span class="note">${nf(g.winner_score)}</span>` : `<span class="note">${g.started_at ? (g.finished_at ? "–" : "Didn't finish") : "Never started"}</span>`}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No games yet in this period.</p>`}
    </section>
    <div class="grid2">
      <section class="card">
        <h2>Hardest questions</h2><p class="sub">Lowest share of correct answers (at least 3 answers)</p>
        ${d.hardest.length ? `<div class="tw"><table><thead><tr><th>Question</th><th>Category</th><th class="n">Correct</th></tr></thead>
          <tbody>${d.hardest.map(h => `<tr><td>${esc(h.question)}</td><td class="note">${esc(h.category)}</td><td class="n"><span class="acc lo">${pct(h.accuracy)}</span> <span class="note">of ${h.answers}</span></td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Not enough answers yet.</p>`}
      </section>
      <section class="card">
        <h2>AI topics requested</h2><p class="sub">Every "Make a category with AI" request</p>
        ${d.ai.length ? `<div class="tw"><table><thead><tr><th>Topic</th><th>Level</th><th class="n">Qs</th><th>When</th></tr></thead>
          <tbody>${d.ai.map(a => `<tr><td><b>${esc(a.topic)}</b>${a.ok ? "" : ` <span class="tag fail" title="${esc(a.error || "")}">Failed</span>`}</td><td class="note">${esc(a.difficulty || "")}</td><td class="n">${a.ok ? a.generated : 0}</td><td class="note">${ago(a.created_at)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No AI rounds yet.</p>`}
      </section>
    </div>
    <p class="note">Updated ${dt(d.generated_at || new Date().toISOString())}. Players are grouped by the name they typed, so the same person with two spellings shows twice.</p>`;
  wireChart();
}

function wireChart(){
  const chart = $("chart"), tip = $("tip"); if (!chart) return;
  chart.querySelectorAll("g.col").forEach(g => {
    g.addEventListener("mouseenter", () => {
      const r = data.per_day[+g.dataset.i];
      const d = new Date(r.day + "T12:00:00").toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" });
      tip.textContent = `${d}: ${r.games} ${r.games===1?"game":"games"}, ${r.players} ${r.players===1?"player":"players"}`;
      const box = g.querySelector(".hit").getBoundingClientRect(), cb = chart.getBoundingClientRect();
      tip.style.left = (box.left - cb.left + box.width/2) + "px";
      tip.style.top = "30px";
      tip.classList.add("on");
    });
    g.addEventListener("mouseleave", () => tip.classList.remove("on"));
  });
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.days){ days = +b.dataset.days; load(); }
  if (b.dataset.act === "refresh") load();
  if (b.dataset.act === "lock"){ keep.clear(); code = ""; renderLogin(); }
});

load();
</script>
